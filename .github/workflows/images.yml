name: native images
on:
  push:
    paths:
      - raft.py
      - raft_files.py
      - images/incus/**
      - deploy/**
      - .github/workflows/images.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a verified release, e.g. v0.1.0; leave empty for validation only'
        required: false
        type: string
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare disposable native Incus fixture
        shell: bash
        run: |
          set -euxo pipefail
          # Free only preinstalled toolchains on this disposable CI VM.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
          test "$(dpkg --print-architecture)" = '${{ matrix.architecture }}'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends btrfs-progs curl gnupg iptables openssh-server python3
          bash deploy/install-incus.sh
          sudo systemctl start ssh
          mkdir -p ~/.ssh ~/.config/raft
          chmod 700 ~/.ssh ~/.config/raft
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/raft-ci-key"
          cat "$RUNNER_TEMP/raft-ci-key.pub" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          printf 'localhost %s\n' "$(sudo cat /etc/ssh/ssh_host_ed25519_key.pub)" >> ~/.ssh/known_hosts
          printf 'Host raft-ci\n  HostName localhost\n  IdentityFile %s\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$RUNNER_TEMP/raft-ci-key" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          printf '{"lab":{"ssh":"raft-ci","image":""}}\n' > ~/.config/raft/incus.json
          chmod 600 ~/.config/raft/incus.json
          # This sparse Btrfs fixture is confined to an ephemeral CI VM. It tests
          # images and workflows, not the production deployer's 80 GiB preflight.
          sudo incus project create raft -c features.images=true -c features.profiles=true
          sudo incus project set raft --property description='Raft managed workspaces'
          sudo incus storage create raft-data btrfs size=60GiB
          sudo incus network create rfbr0 ipv4.address=10.232.0.1/24 ipv4.nat=true ipv6.address=none
          sudo incus --project raft profile device add default root disk path=/ pool=raft-data
          sudo incus --project raft profile device add default eth0 nic network=rfbr0 name=eth0
          sudo incus --project raft profile set default limits.cpu=1 limits.memory=2GiB security.nesting=true security.syscalls.intercept.mknod=true security.syscalls.intercept.setxattr=true
          sudo install -d /usr/local/lib/raft
          sudo install -m 755 deploy/raft-network.sh /usr/local/lib/raft/network
          sudo install -m 755 deploy/raft-expire.py /usr/local/lib/raft/expire-worker
          printf '#!/bin/sh\nexec flock /run/lock/raft-incus.lock /usr/local/lib/raft/expire-worker "$@"\n' > "$RUNNER_TEMP/raft-expire"
          sudo install -m 755 "$RUNNER_TEMP/raft-expire" /usr/local/lib/raft/expire
          sudo install -m 644 deploy/raft-network.service deploy/raft-expire.service deploy/raft-expire.timer /etc/systemd/system/
          sudo install -d /etc/systemd/system/incus.service.d
          sudo install -m 644 deploy/incus-network.conf /etc/systemd/system/incus.service.d/raft-network.conf
          sudo systemctl daemon-reload
          sudo systemctl enable raft-network.service raft-expire.timer
          sudo systemctl reload-or-restart raft-network.service
          sudo systemctl start raft-expire.timer
      - name: Build native development image
        run: |
          python3 deploy/build-image.py --location lab
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          images=json.loads(subprocess.check_output(['sudo','incus','--project','raft','image','list','raft-dev','--format','json']))
          fingerprint=next(image['fingerprint'] for image in images if any(alias['name']=='raft-dev' for alias in image['aliases']))
          path=Path.home()/'.config/raft/incus.json'
          config=json.loads(path.read_text()); config['lab']['image']=fingerprint
          path.write_text(json.dumps(config))
          PY
      - name: Diagnose a failed native build
        if: failure()
        run: |
          sudo incus --project raft info raft-builder --show-log || true
          sudo journalctl -u incus --no-pager -n 80
          df -h /
      - name: Verify lifecycle, desktop and all development tools
        run: python3 deploy/verify-live.py --location lab --extended --restart-incus
      - name: Verify host capacity and real box transitions
        run: python3 deploy/verify-limits.py --location lab
      - name: Verify disposable lifecycle, templates, resizing and recursive transfers
        run: python3 deploy/verify-features.py --location lab
      - name: Verify full development-image backup and recovery
        run: python3 deploy/verify-controls.py --source lab --target lab --development-image --directory "$RUNNER_TEMP"
      - name: Measure cached-image startup
        run: |
          mkdir -p image-artifacts
          python3 deploy/benchmark-boot.py --location lab --samples 5 --desktop > image-artifacts/boot-${{ matrix.architecture }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boot-results-${{ matrix.architecture }}
          path: image-artifacts/boot-*.json
          retention-days: 7
      - name: Export clean template
        run: |
          fingerprint=$(python3 -c 'import json,pathlib; print(json.loads((pathlib.Path.home()/".config/raft/incus.json").read_text())["lab"]["image"])')
          sudo incus --project raft image export "$fingerprint" "image-artifacts/raft-dev-${{ matrix.architecture }}"
          sudo chown -R "$(id -u):$(id -g)" image-artifacts
          python3 deploy/verify-image.py "image-artifacts/raft-dev-${{ matrix.architecture }}.tar.gz" --architecture '${{ matrix.architecture }}' --fingerprint "$fingerprint"
          cd image-artifacts
          sha256sum raft-dev-* > SHA256SUMS-${{ matrix.architecture }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raft-dev-${{ matrix.architecture }}
          path: image-artifacts/
          retention-days: 7
          compression-level: 0

  fresh-host:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: raft-dev-amd64
          path: image-artifacts
      - name: Prepare disposable KVM host test
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils curl openssh-client python3
          sudo chmod a+rw /dev/kvm
          cd image-artifacts
          sha256sum -c SHA256SUMS-amd64
      - name: Verify fresh provisioning, import and host reboot
        run: python3 deploy/verify-fresh-host.py image-artifacts/raft-dev-amd64.tar.gz
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [image, fresh-host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify release version and build CLI packages
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$RELEASE_TAG" = "v$(python3 raft.py --version)"
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'Release tag already exists; published versions are never overwritten' >&2
            exit 1
          fi
          uv sync --locked
          uv build
          uv run python deploy/verify-release.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: raft-dev-*
          merge-multiple: true
          path: release-assets
      - name: Verify assets and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          cp dist/* release-assets/
          cd release-assets
          sha256sum -c SHA256SUMS-arm64
          sha256sum -c SHA256SUMS-amd64
          sha256sum raft-*.whl raft-*.tar.gz microck-raft-*.tgz manifest-*.json packages-*.tsv npm-packages-*.json boot-*.json > SHA256SUMS
          cd ..
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          notes = Path(f'docs/releases/{version}.md').read_text().split('---', 2)[2].lstrip()
          Path('release-notes.md').write_text(notes)
          PY
      - name: Publish verified npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
          npm publish dist/microck-raft-*.tgz --access public --provenance
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Microck
          git config user.email contact@micr.dev
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -F release-notes.md
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" release-assets/raft-*.whl release-assets/raft-*.tar.gz release-assets/microck-raft-*.tgz release-assets/SHA256SUMS release-assets/manifest-*.json release-assets/packages-*.tsv release-assets/npm-packages-*.json release-assets/boot-*.json --verify-tag --title "Raft $RELEASE_TAG" --notes-file release-notes.md --latest
