name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked
      - run: uvx ruff check raft.py raft_files.py deploy/*.py
      - run: uvx ruff format --check raft.py raft_files.py deploy/*.py
      - run: uv run python -m compileall -q raft.py raft_files.py deploy
      - run: uv run python deploy/verify-limits.py
      - run: uv run python deploy/verify-image-tests.py
      - run: uv run python deploy/verify-features.py
      - run: uv build
      - run: uv run python deploy/verify-release.py
