[project]
name = "raft"
version = "0.1.0"
description = "Self-hosted persistent Linux workspaces powered by Incus"
requires-python = ">=3.11.8"
dependencies = []
readme = "README.md"
license = "MIT"

[project.scripts]
raft = "raft:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["raft.py", "raft_files.py", "pyproject.toml", "uv.lock", "README.md", "LICENSE", ".gitignore", "deploy/", "docs/", "images/", "skills/", ".github/"]
exclude = ["/.jj", "/.git", "**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
include = ["raft.py", "raft_files.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
